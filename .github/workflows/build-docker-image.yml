name: Build & Deploy

on:
    workflow_dispatch:
    push:
        branches:
            - main
        tags:
            - v*

env:
    REGISTRY: ghcr.io
    API_IMAGE_NAME: ${{ github.repository }}/gorss
    WEB_IMAGE_NAME: ${{ github.repository }}/gorss-web

jobs:
    build-api-docker-image:
        name: Build Api Docker Image
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4

            -   name: Log in to the Container registry
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.ghcr_TOKEN }}

            -   name: Extract metadata (tags, labels) for Api
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}

            -   name: Build and push Api
                uses: docker/build-push-action@v5
                with:
                    file: docker/Dockerfile.api
                    context: .
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}

    build-web-docker-image:
        name: Build Web Docker Image
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4

            -   name: Log in to the Container registry
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.ghcr_TOKEN }}

            -   name: Extract metadata (tags, labels) for Web
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}

            -   name: Build and push Web
                uses: docker/build-push-action@v5
                with:
                    file: docker/Dockerfile.web
                    context: .
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}

    deploy-railway-uat:
        name: Deploy Railway Services (UAT)
        runs-on: ubuntu-latest
        needs:
            - build-api-docker-image
            - build-web-docker-image
#        if: github.ref == 'refs/heads/main'
        environment: gorss / uat

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4

            -   name: Deploy API service image
                run: bash ./scripts/deploy-railway-image.sh --railway-token "${{ secrets.RAILWAY_TOKEN }}" --railway-project-id "${{ secrets.RAILWAY_PROJECT_ID }}" --railway-environment-name "uat" --railway-service-id "${{ secrets.RAILWAY_SERVICE_API }}" --image-repository "${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}" --image-tag "${{ steps.meta.outputs.tags }}"

            -   name: Deploy Web service image
                run: bash ./scripts/deploy-railway-image.sh --railway-token "${{ secrets.RAILWAY_TOKEN }}" --railway-project-id "${{ secrets.RAILWAY_PROJECT_ID }}" --railway-environment-name "uat" --railway-service-id "${{ secrets.RAILWAY_SERVICE_WEB }}" --image-repository "${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}" --image-tag "${{ steps.meta.outputs.tags }}"

    deploy-railway-prod:
        name: Deploy Railway Services (Production)
        runs-on: ubuntu-latest
        needs:
            - build-api-docker-image
            - build-web-docker-image
        if: startsWith(github.ref, 'refs/tags/')
        environment: gorss / production

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4

            -   name: Deploy API service image
                run: bash ./scripts/deploy-railway-image.sh --railway-token "${{ secrets.RAILWAY_TOKEN }}" --railway-project-id "${{ secrets.RAILWAY_PROJECT_ID }}" --railway-environment-name "production" --railway-service-id "${{ secrets.RAILWAY_SERVICE_API }}" --image-repository "${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}" --image-tag "${{ steps.meta.outputs.tags }}"

            -   name: Deploy Web service image
                run: bash ./scripts/deploy-railway-image.sh --railway-token "${{ secrets.RAILWAY_TOKEN }}" --railway-project-id "${{ secrets.RAILWAY_PROJECT_ID }}" --railway-environment-name "production" --railway-service-id "${{ secrets.RAILWAY_SERVICE_WEB }}" --image-repository "${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}" --image-tag "${{ steps.meta.outputs.tags }}"
